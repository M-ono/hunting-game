<title>ハンティングゲーム（仮）</title>
<style>
  /* 試遊用ページ（Claude のアーティファクト）。ゲームの見た目に合わせて暗い背景だけで作る */
  :root {
    color-scheme: dark;
    --bg: #070b14;
    --fg: #e8edf7;
  }
  html,
  body {
    height: 100%;
  }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    position: relative;
    width: 100%;
    height: 100%;
  }
  #boot-message {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    margin: 0;
    padding-inline: 16px;
    text-align: center;
    font: 600 16px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  /* canvas の下にできる文字行ぶんの隙間（ページが数pxスクロールする原因）を消す */
  #game canvas {
    display: block;
  }
  #game:has(canvas) #boot-message {
    display: none;
  }
</style>
<div id="game"><p id="boot-message">読み込み中…</p></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
<script>
  if (!window.Phaser) {
    document.getElementById('boot-message').textContent =
      'ゲームの部品（Phaser）を読み込めませんでした。通信状態を確かめて、ページを開き直してください。';
  }
</script>
<script type="module" src="game.js"></script>
